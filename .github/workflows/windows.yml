# The Windows zip (tools/win-app/build.sh) on a GitHub Windows runner, uploaded as the run's artifact.
# DIY: 跟着 main 一起构建，和安卓版同步出包；也可以手动触发。
name: windows
on:
  push:
    branches: [windows, main]
  workflow_dispatch:
jobs:
  zip:
    runs-on: windows-latest
    # 发布 release 需要写权限（默认 token 是只读的，不加会 403 Resource not accessible）
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/cache@v6
        with:
          path: |
            models
            tools/win-app/build/*.jar
          key: win-deps-v2-${{ hashFiles('setup.sh', 'tools/win-app/build.sh') }}
      # 版本名和安卓用同一个算法（1000 + 本工作流的运行序号；两条流水线成对触发，序号一致），
      # 桌面端 exe 的「关于」和检查更新都读它
      - run: echo "CI_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      # 把这次构建的提交号写进包内资源：桌面端「检查更新」用它和线上清单比对，
      # 相同就说明已是最新，不再提示更新（桌面端没有应用内更新，只能靠这个判断）。
      - run: |
          mkdir -p desktop/src/main/resources
          printf '%s' "$GITHUB_SHA" > desktop/src/main/resources/build-commit.txt
          echo "build-commit: $(cat desktop/src/main/resources/build-commit.txt)"
      - run: tools/win-app/build.sh
      - if: failure()
        run: cat desktop/build/compose/logs/*/*.txt || true
      # quick check of the helper: it must start, find an output device or say why, and exit
      - run: |
          R=tools/win-app/build/resources/windows-x64
          "$R/sysaudio.exe" 2 > /tmp/pcm 2> /tmp/err || true
          cat /tmp/err; ls -la /tmp/pcm
      # GitHub zips an artifact itself: upload the app folder, so the download unzips straight to SimulSub/ (the
      # Release's zip is the same folder, zipped once by tools/win-app/build.sh)
      - uses: actions/upload-artifact@v7
        with:
          name: SimulSub-windows-x64-Plus${{ env.CI_VERSION_CODE }}
          path: tools/win-app/build/zip/

      # 发布：把 zip 挂到和安卓同一个滚动 release（plus-latest）的 Assets 里。
      # 只保留这一条 release：正文由安卓流水线写（版本号、更新内容、双端下载链接），Windows 这边只挂资产，
      # 不再另建 windows-latest / win-first，避免下载页分裂成好几条。
      - name: 发布 Windows 包
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP=$(ls desktop/build/compose/binaries/main/SimulSub-*-windows-x64.zip | head -1)
          NAME=$(basename "$ZIP" -windows-x64.zip)   # SimulSub-Plus1007
          WINNAME="Windows-$NAME-x64.zip"
          MB=$(( $(stat -c%s "$ZIP") / 1048576 ))
          echo "zip: $ZIP -> $WINNAME ($MB MB)"
          # 和安卓在同一个下载页：文件名带 Windows 前缀和版本号，Assets 里一眼分得清
          # （gh 的 file#label 只改显示标签、不改资产名，所以先把文件复制成目标名）
          # 两个流水线同时跑，谁先到谁建：已存在时 create 失败，忽略就行
          gh release create plus-latest --title "最新构建" --notes "首次创建" --latest >/dev/null 2>&1 || true
          mkdir -p dist && cp "$ZIP" "dist/$WINNAME"
          gh release upload plus-latest "dist/$WINNAME" --clobber
          # 旧包一律留着：滚动 release 只覆盖同名文件，以前版本的 zip 仍可下载
          echo "已挂到 plus-latest 的 Assets"
          # latest 必须留在这条滚动 release 上，否则应用内更新会读到别的版本页
          gh release edit plus-latest --latest
